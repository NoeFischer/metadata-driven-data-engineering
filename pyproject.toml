[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metadata-driven-de"
version = "0.1.0"
description = "Metadata-driven data engineering framework for PySpark / Databricks"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.20",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
mdde = "metadata_driven_de.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
